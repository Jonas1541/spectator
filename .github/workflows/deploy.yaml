name: Deploy Spectator to VPS

# A pipeline é engatilhada sempre que houver um push na branch main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Executar comandos via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Abaixo estão os comandos que o GitHub vai digitar na sua VPS
          script: |
            # Mude para a pasta onde o repositório foi clonado na VPS
            # (Substitua o caminho abaixo pelo caminho real da sua VPS)
            cd spectator
            
            # Puxa o código novo
            git pull origin main
            
            # Rebuilda a imagem do Spring Boot e reinicia o container em background
            docker compose up --build -d
            
            # Limpa imagens antigas do Docker para não lotar o disco da VPS com o tempo
            docker image prune -f