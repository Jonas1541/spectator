services:
  # --- Aplicação (Spring Boot + Vaadin) ---
  app:
    build: .
    image: spectator-app:latest
    container_name: spectator-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://timescaledb:5432/spectator
      - SPRING_DATASOURCE_USERNAME=spectator_user
      - SPRING_DATASOURCE_PASSWORD=spectator_pass
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      timescaledb:
        condition: service_healthy
    # Profile 'app': Este container só sobe se você pedir explicitamente ou rodar com profile
    profiles:
      - prod 

  # --- Banco de Dados (TimescaleDB) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: spectator-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=spectator
      - POSTGRES_USER=spectator_user
      - POSTGRES_PASSWORD=spectator_pass
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectator_user -d spectator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Interface do Banco (pgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: spectator-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spectator.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - timescaledb

  # --- Prometheus (Coleta de Métricas) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: spectator-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Grafana (Dashboard de Métricas) ---
  grafana:
    image: grafana/grafana:latest
    container_name: spectator-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=spectator
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  timescale_data:
  prometheus_data:
  grafana_data: